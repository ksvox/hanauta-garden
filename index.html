<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハナウタ・ガーデン | 鼻歌で咲く、世界にひとつの花</title>
<meta name="description" content="30秒の鼻歌から、あなただけの花が咲く！">

  body{ margin:0; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; background:var(--paper); color:var(--ink); }
  .wrap{ max-width:520px; margin:0 auto; padding:0 14px 40px; }
  .screen{ display:none; } .screen.on{ display:block; animation:fade .35s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  h1{ font-size:30px; text-align:center; margin:22px 0 2px; letter-spacing:.06em; }
  .sub{ text-align:center; color:#7a7264; font-size:13px; margin:0 0 14px; }
  .hero{ width:100%; border-radius:18px; box-shadow:0 10px 30px rgba(60,40,20,.22); display:block; }
  .howto{ background:var(--card); border-radius:14px; padding:12px 16px; margin:14px 0; font-size:14px; line-height:1.9; box-shadow:0 2px 10px rgba(60,40,20,.08); }
  .btn{ display:block; width:100%; border:none; border-radius:999px; padding:16px; font-size:18px; font-weight:700; cursor:pointer; margin:10px 0; font-family:inherit; }
  .btn-main{ background:linear-gradient(135deg,#d9577f,#c2456e); color:#fff; box-shadow:0 6px 18px rgba(194,69,110,.35); }
  .btn-sub{ background:#efe7d8; color:var(--ink); }
  .btn-share{ background:linear-gradient(135deg,#4b8a5e,#3f7a4e); color:#fff; box-shadow:0 6px 18px rgba(63,122,78,.3); }
  .btn:disabled{ opacity:.45; }
  .bgs{ display:flex; gap:10px; margin:12px 0; }
  .bgopt{ flex:1; border:3px solid transparent; border-radius:14px; overflow:hidden; cursor:pointer; padding:0; background:none; }
  .bgopt img{ width:100%; height:110px; object-fit:cover; display:block; }
  .bgopt.sel{ border-color:var(--accent); }
  .bgopt span{ display:block; font-size:12px; padding:5px 0; background:var(--card); }
  .stage-wrap{ position:sticky; top:0; z-index:5; background:var(--paper); padding-top:8px; }
  canvas#stage{ width:100%; border-radius:16px; box-shadow:0 10px 30px rgba(60,40,20,.25); display:block; background:#20351f; }
  .timer{ text-align:center; font-size:15px; margin:10px 0 2px; color:#7a7264; }
  .timer b{ font-size:22px; color:var(--ink); }
  .card{ background:var(--card); border-radius:16px; padding:16px 18px; margin:14px 0; box-shadow:0 2px 12px rgba(60,40,20,.1); }
  .fname{ font-size:21px; font-weight:800; text-align:center; margin:2px 0; }
  .fno{ text-align:center; color:#a08b62; font-size:12px; letter-spacing:.12em; margin-bottom:8px; }
  .fintro{ font-size:13.5px; line-height:1.85; }

  .wiltbar i{ display:block; height:100%; background:linear-gradient(90deg,#d98a4b,#c2456e); width:100%; }

<div class="wrap">

  <!-- トップ -->
  <section id="scr-home" class="screen on">
    <p class="brand">K's VOX オリジナルアプリ</p>
    <h1>ハナウタ・ガーデン</h1>
    <p class="sub">鼻歌で咲く、世界にひとつの花</p>
    <img class="hero" src="hero.jpg" alt="ハナウタ・ガーデンの花">
    <div class="howto">
      🎵 スマホを口の前15cmに持って、30秒鼻歌をうたう<br>
      🌱 歌声にある生命力が花に宿る<br>
      🌸 咲いた花は図鑑カードにして持ち帰れる
    </div>
    <button class="btn btn-main" id="btn-to-setup">花を咲かせる</button>
  </section>

  <!-- 場所えらび -->
  <section id="scr-setup" class="screen">
    <h1 style="font-size:22px;">① 場所をえらぶ</h1>
    <div class="bgs" id="bgs"></div>
    <h1 style="font-size:22px;">② うたいはじめる</h1>
    <div class="howto">
      スマホを口の前15cmくらいに持ってください。<br>
      好きな歌でも、即興でもOK。30秒たつと自動で終わります。
    </div>
    <button class="btn btn-main" id="btn-start">🌱 花を育てる（30秒）</button>
    <button class="btn btn-sub" id="btn-back-home">もどる</button>
  </section>

  <!-- 録音〜結果 -->
  <section id="scr-play" class="screen">
    <div class="stage-wrap"><canvas id="stage" width="900" height="1125"></canvas></div>
    <p class="timer" id="timer"></p>
    <button class="btn btn-main" id="btn-finish" style="display:none;">うたい終わる</button>

    <div id="result" style="display:none;">
      <div class="card">
        <p class="fname" id="f-name"></p>
        <p class="fno" id="f-no"></p>
        <p class="fintro" id="f-intro"></p>
      </div>
      <button class="btn btn-share" id="btn-save">💾 満開のまま保存する</button>
      <button class="btn btn-share" id="btn-share" style="background:linear-gradient(135deg,#5b7fa6,#42648c); box-shadow:0 6px 18px rgba(66,100,140,.3);">📤 シェアする</button>
      <div id="wiltbox">
        <p class="timer" style="margin-bottom:0;"><span id="wilt-label">この花は <b id="wilt-sec">10</b> 秒後に枯れてしまいます</span></p>
        <div class="wiltbar"><i id="wilt-fill"></i></div>
      </div>
      <p class="note">保存・シェアされる画像は、ボタンを受け付けた瞬間に「満開の姿」で描き直したものです。<br>画面の花が散りはじめても、画像はいつも満開です。</p>
      <button class="btn btn-sub" id="btn-again" style="display:none;">🌱 もう一度育てる</button>
    </div>
  </section>

  <p class="brand"><a href="https://www.ksvox.net" target="_blank" rel="noopener">Ⓒボーカル道場K's VOX</a></p>

</div>

      d[i] = (nr + m) * 255; d[i+1] = (ng + m) * 255; d[i+2] = (nb + m) * 255;
    }
    x.putImageData(id, 0, 0);
  }
  dyeCache[key] = c;
  return c;
}

/* ========= 株の構築 ========= */
function stemFiles(sp){ return { bud: sp.base + '-bud', half: sp.base + '-half', full: sp.base + '-full', fullb: sp.base + '-fullb' }; }
async function loadSpeciesImages(sp){
  const f = stemFiles(sp);
  const out = {};
  for (const k of ['bud','half','full','fullb']){
    let img = await loadImg(A4 + f[k] + '.webp');
    if (!img && k === 'fullb') img = out.full;
    if (!img && k === 'half') img = out.full || await loadImg(A4 + f.full + '.webp');
    if (!img && k === 'bud') img = out.half || out.full;
    out[k] = img;
    out[k + 'Name'] = img ? (ANCH[f[k]] ? f[k] : f.full) : f.full;
  }
  out.sprig = await loadImg(A4 + sp.sprig + '.webp');
  out.sprout = await loadImg(A4 + sp.sprout + '.webp');
  return out;
}
function buildStock(group, sp, color, rootX, groundY, seedStr, volScale){
  const r = rng(hashStr(seedStr));
  const sf = sp.scaleF || 1;
  let phrases = group.slice(0, 6);
  const stems = [];
  const n = Math.max(2, Math.min(6, phrases.length + (phrases.length === 1 ? 2 : 0)));
  for (let i = 0; i < n; i++){
    const p = phrases[Math.min(i, phrases.length - 1)];
    const c = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
    stems.push({
      rot: c * 16 + (r() * 6 - 3),
      flip: r() < 0.5,
      ind: i % 2 === 0 ? 'full' : 'fullb',
      dispH: clamp(300 + p.durSec * 42, 320, 560) * sf * volScale,
      birth: p.start,
      hueJ: (r() * 10 - 5), satJ: (r() * 0.1 - 0.05), lightJ: (r() * 0.12 - 0.06),
      headPos: null,
    });
  }
  const sprigCount = clamp(Math.round(group.reduce((s,p)=>s+p.notes.length,0) / 3.5), 3, 9);
  const sprigs = [];
  for (let i = 0; i < sprigCount; i++){
    const c = sprigCount === 1 ? 0 : (i / (sprigCount - 1)) * 2 - 1;
    sprigs.push({ rot: c * 34 + (r() * 10 - 5), len: 120 + r() * 130, delay: r() * 0.25, flip: r() < 0.5 });
  }
  return { sp, color, rootX, groundY, stems, sprigs, imgs: null };
}

/* ========= 描画 ========= */
const cv = $('stage'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
function drawAnchored(x, img, name, rootX, rootY, dispH, rotDeg, flip, alpha){
  if (!img) return null;
  const anch = ANCH[name] || { root:[0.5, 0.99], head:[0.5, 0.25] };
  const s = dispH / img.height, w = img.width * s, h = img.height * s;
  const rx = (flip ? 1 - anch.root[0] : anch.root[0]) * w, ry = anch.root[1] * h;
  x.save(); x.translate(rootX, rootY); x.rotate(rotDeg * Math.PI / 180); if (flip) x.scale(-1, 1);
  x.globalAlpha *= alpha;
  x.drawImage(img, -rx, -ry, w, h);
  x.restore();
  const hx = (flip ? 1 - anch.head[0] : anch.head[0]) * w - rx, hy = anch.head[1] * h - ry;
  const th = rotDeg * Math.PI / 180;
  return { x: rootX + hx * Math.cos(th) - hy * Math.sin(th), y: rootY + hx * Math.sin(th) + hy * Math.cos(th) };
}
function stageFor(prog){
  if (prog < 0.45) return [{ k:'bud', a:1 }];
  if (prog < 0.75) { const t = (prog - 0.45) / 0.3; return [{ k:'bud', a:1 - t }, { k:'half', a:t }]; }
  const t = (prog - 0.75) / 0.25; return [{ k:'half', a:1 - t }, { k:'full', a:t }];
}
function drawStock(x, stock, progOf, now, opts){
  const { sp, imgs } = stock; if (!imgs) return;
  const gy = stock.groundY;
  /* 土の盛り上がり */
  x.save(); x.fillStyle = 'rgba(70,50,30,0.35)';
  x.beginPath(); x.ellipse(stock.rootX, gy + 6, 120, 20, 0, 0, 6.29); x.fill(); x.restore();
  const sway = now ? Math.sin(now / 1400 + stock.rootX) * 0.7 : 0;
  /* 葉（根元から上向きに） */
  for (const sg of stock.sprigs){
    const p = clamp((progOf.global - sg.delay) / 0.6, 0, 1);
    if (p <= 0 || !imgs.sprig) continue;
    drawAnchored(x, imgs.sprig, sp.sprig, stock.rootX, gy + 4, sg.len * (0.4 + 0.6 * easeOut(p)), sg.rot + sway * 0.5, sg.flip, Math.min(1, p * 1.6));
  }
  /* 芽（初期） */
  if (progOf.sprout > 0 && progOf.sprout < 1 && imgs.sprout){
    drawAnchored(x, imgs.sprout, sp.sprout, stock.rootX, gy + 4, 90 * easeOut(progOf.sprout) + 10, sway * 0.4, false, 1);
  }
  /* 茎（段階素材のクロスフェード） */
  stock.stems.forEach((st, i) => {
    const prog = progOf.stem(st, i);
    if (prog <= 0) return;
    const sf = stageFor(prog);
    const scaleF = 0.34 + 0.66 * easeOut(clamp(prog / 0.9, 0, 1));
    for (const layer of sf){
      let img = imgs[layer.k], name = imgs[layer.k + 'Name'];
      if (layer.k === 'full'){
        img = st.ind === 'fullb' ? imgs.fullb : imgs.full;
        name = st.ind === 'fullb' ? imgs.fullbName : imgs.fullName;
      }
      if (!img) continue;
      const dyed = dyeImage(img, sp, stock.color.hue + st.hueJ, clamp(stock.color.sat + st.satJ, 0, 1), clamp(stock.color.light + st.lightJ, 0, 1));
      const head = drawAnchored(x, dyed, name, stock.rootX, gy, st.dispH * scaleF, st.rot + sway, st.flip, layer.a);
      if (layer.k === 'full' && layer.a > 0.5) st.headPos = head;
    }
  });
}
function drawHaloFrame(x, stockList, t01){
  if (!stockList.length) return;
  const cx = stockList.reduce((s, st) => s + st.rootX, 0) / stockList.length;
  const cy = stockList[0].groundY - 240;
  const g = x.createRadialGradient(cx, cy, 30, cx, cy, 380);
  g.addColorStop(0, `rgba(255,240,190,${0.5 * t01})`); g.addColorStop(1, 'rgba(255,240,190,0)');
  x.save(); x.fillStyle = g; x.fillRect(0, 0, W, H); x.restore();
  x.save(); x.strokeStyle = `rgba(198,158,74,${0.9 * t01})`; x.lineWidth = 5; x.strokeRect(16, 16, W - 32, H - 32);
  x.strokeStyle = `rgba(255,226,150,${0.8 * t01})`; x.lineWidth = 2; x.strokeRect(26, 26, W - 52, H - 52); x.restore();
}

/* 録音中の簡易解析（成長表示用） */
let liveSpecies = null, liveStocks = null, liveLockedAt = 0;
async function refreshLive(t){
  const an = analyzeFrames(frames);
  if (!an) return;
  if (!liveSpecies && (t >= 7 || an.phrases.length >= 3)){
    const sp = selectSpecies(an.feat, an.fingerprint);
    liveSpecies = sp; liveLockedAt = t;
    const color = pickColor(an.feat, sp, hashStr(an.fingerprint));
    const gy = H * BGS[selBg].ground;
    const volScale = clamp(0.85 + an.feat.meanRms * 1.2, 0.85, 1.25);
    liveStocks = [buildStock(an.groups[0], sp, color, W / 2, gy, an.fingerprint, volScale)];
    if (an.groups[1]){
      const sp2 = selectSpecies(groupFeatures(an, an.groups[1]), an.fingerprint + 'b');
      const color2 = pickColor(an.feat, sp2, hashStr(an.fingerprint + 'b'));
      liveStocks.push(buildStock(an.groups[1], sp2, color2, W * 0.78, gy, an.fingerprint + 'b', volScale));
      liveStocks[0].rootX = W * 0.3;
    }
    for (const st of liveStocks) st.imgs = await loadSpeciesImages(st.sp);
    garden = liveStocks;
  } else if (liveStocks){
    /* 新しいフレーズが増えたら茎を足す */
    const an2 = an;
    const g0 = an2.groups[0];
    if (g0.length > liveStocks[0].stems.length - 2 && g0.length <= 6){
      const keep = liveStocks[0];
      const rebuilt = buildStock(g0, liveSpecies, keep.color, keep.rootX, keep.groundY, analysis ? analysis.fingerprint : 'live', 1);
      rebuilt.imgs = keep.imgs; rebuilt.stems = rebuilt.stems.map((s, i) => keep.stems[i] || s);
      liveStocks[0] = rebuilt; garden = liveStocks;
    }
  }
}
async function drawLiveFrame(t){
  const bgImg = await loadImg(A3 + BGS[selBg].file);
  ctx.clearRect(0, 0, W, H); if (bgImg) ctx.drawImage(bgImg, 0, 0, W, H);
  const gy = H * BGS[selBg].ground;

  }

  };

}
$('btn-start').onclick = async () => {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') await AC.resume();
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
  } catch (e) { alert('マイクを使えませんでした。ブラウザのマイク許可を確認してください。'); return; }
  show('scr-play'); $('result').style.display = 'none'; $('btn-finish').style.display = 'block';
  stopAll(); liveSpecies = null; liveStocks = null; garden = null;
  const src = AC.createMediaStreamSource(stream);
  analyser = AC.createAnalyser(); analyser.fftSize = 2048; src.connect(analyser);
  frames = []; recStart = performance.now();
  const buf = new Float32Array(analyser.fftSize), fbuf = new Float32Array(analyser.frequencyBinCount);
  let lastLive = 0;
  const tick = () => {
    const t = (performance.now() - recStart) / 1000;

    const { f, rms } = autoPitch(buf, AC.sampleRate);
    analyser.getFloatFrequencyData(fbuf);
    let num = 0, den = 0;
    for (let i = 2; i < fbuf.length; i++){ const m = Math.pow(10, fbuf[i] / 20); num += i * (AC.sampleRate / analyser.fftSize) * m; den += m; }
    frames.push({ t, f, rms, cent: den > 0 ? num / den : 0 });
    $('timer').innerHTML = `うたっています… あと <b>${Math.max(0, 30 - Math.floor(t))}</b> 秒`;
    if (t - lastLive > 0.45){ lastLive = t; refreshLive(t); }

};
function finishRecording(){

  $('btn-finish').style.display = 'none';

  if (!analysis){ $('timer').textContent = '声がうまく拾えませんでした。もう少し近くで、はっきりうたってみてください。'; $('btn-again').style.display = 'block'; $('result').style.display = 'block'; $('f-name').textContent = ''; $('f-intro').textContent = ''; $('f-no').textContent = ''; return; }
  startCeremony();
}
$('btn-finish').onclick = finishRecording;

async function startCeremony(){
  const an = analysis;
  const gy = H * BGS[selBg].ground;
  const volScale = clamp(0.85 + an.feat.meanRms * 1.2, 0.85, 1.25);
  const stocks = [];
  const mainSp = liveSpecies || selectSpecies(an.feat, an.fingerprint);
  const mainColor = pickColor(an.feat, mainSp, hashStr(an.fingerprint));
  const two = an.groups.length > 1;
  stocks.push(buildStock(an.groups[0], mainSp, mainColor, two ? W * 0.3 : W / 2, gy, an.fingerprint, volScale));
  if (two){
    const sp2 = selectSpecies(groupFeatures(an, an.groups[1]), an.fingerprint + 'b');
    stocks.push(buildStock(an.groups[1], sp2, pickColor(an.feat, sp2, hashStr(an.fingerprint + 'b')), W * 0.76, gy, an.fingerprint + 'b', volScale));
  }
  for (const st of stocks) st.imgs = await loadSpeciesImages(st.sp);
  garden = stocks;
  flowerInfo = makeFlowerInfo(an, stocks[0]);
  stocks[0].stems.forEach((st, idx) => setTimeout(() => pluck(440 * Math.pow(2, (idx * 4 - 6) / 12), 0, 0.12), 300 + idx * 220));
  $('timer').textContent = '花が咲きました 🌸';
  phase = 'ceremony'; const t0 = performance.now();
  const step = (now) => {
    if (phase !== 'ceremony') return;
    const el = (now - t0) / 1000;
    const bgP = loadImg(A3 + BGS[selBg].file);
    bgP.then(bgImg => {
      ctx.clearRect(0, 0, W, H); if (bgImg) ctx.drawImage(bgImg, 0, 0, W, H);
      const progOf = { global: 1, sprout: 1, stem: () => clamp(0.72 + el / 1.6 * 0.28, 0, 1) };
      for (const stock of garden) drawStock(ctx, stock, progOf, now, {});
      drawHaloFrame(ctx, garden, clamp(el / 1.2, 0, 1));
    });
    if (el < 1.9) rafId = requestAnimationFrame(step);
    else { phase = 'show'; runLoop(); onBloom(); }
  };
  rafId = requestAnimationFrame(step);
}
function runLoop(){
  cancelAnimationFrame(rafId);
  const step = (now) => {
    const draw = (bgImg) => {
      ctx.clearRect(0, 0, W, H); if (bgImg) ctx.drawImage(bgImg, 0, 0, W, H);
      if (!garden) return;
      if (phase === 'wilt'){
        const w = wilt ? clamp(wilt.level, 0, 1) : 0;
        ctx.save(); ctx.globalAlpha = 1 - 0.9 * w;
        if (w > 0) ctx.filter = `saturate(${1 - 0.72 * w}) brightness(${1 - 0.22 * w})`;
        const progOf = { global: 1, sprout: 1, stem: () => 1 };
        for (const stock of garden) drawStock(ctx, stock, progOf, now, {});
        ctx.restore();
        updatePetals(now, w);
        if (w >= 1){ phase = 'done'; return; }
      } else {
        const progOf = { global: 1, sprout: 1, stem: () => 1 };
        for (const stock of garden) drawStock(ctx, stock, progOf, now, {});
        drawHaloFrame(ctx, garden, phase === 'show' ? 1 : 0.6);
      }
    };
    loadImg(A3 + BGS[selBg].file).then(draw);
    if (phase === 'show' || phase === 'wilt') rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}
function onBloom(){
  $('timer').textContent = '';
  $('f-name').textContent = flowerInfo.name;
  $('f-no').textContent = 'Bloom No. ' + hashStr(analysis.fingerprint).toString(36).toUpperCase().padStart(7, '0');
  $('f-intro').textContent = flowerInfo.intro;
  $('result').style.display = 'block'; $('btn-again').style.display = 'none';
  $('wiltbox').innerHTML = wiltboxHTML;

}
/* ========= 完成の表示（10秒）→ 枯れる（10秒）→ 土に戻る ========= */
function startShow(){
  phase = 'show'; showT0 = performance.now(); wilt = null;
  clearInterval(showIv);
  showIv = setInterval(() => {
    if (phase !== 'show' && phase !== 'wilt'){ clearInterval(showIv); return; }
    const now = performance.now();

      const sec = $('wilt-sec'); if (sec) sec.textContent = Math.max(0, Math.ceil(10 - el));

function beginWilt(now){

let petalImgs = [];
async function updatePetals(now, w){
  if (!petalImgs.length) petalImgs = await Promise.all(PETAL_FILES.map(f => loadImg(A3 + f)));
  if (w > 0.05 && Math.random() < w * 0.55 && petals.length < 70 && garden){
    const heads = garden.flatMap(st => st.stems.map(s => s.headPos).filter(Boolean));
    if (heads.length){
      const hp = heads[Math.floor(Math.random() * heads.length)];
      petals.push({ img: petalImgs[Math.floor(Math.random() * petalImgs.length)], x: hp.x + (Math.random() - 0.5) * 60, y: hp.y, vx: (Math.random() - 0.5) * 0.4, vy: 0.4 + Math.random() * 0.5, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.06, size: 16 + Math.random() * 22, ph: Math.random() * 6.28 });
    }
  }
  petals = petals.filter(pt => pt.y < H + 40);
  for (const pt of petals){
    pt.ph += 0.05; pt.x += pt.vx + Math.sin(pt.ph) * 0.7; pt.y += pt.vy; pt.vy += 0.004; pt.rot += pt.vr;
    if (pt.img){ ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot); ctx.globalAlpha = 0.92; const s = pt.size / pt.img.width; ctx.drawImage(pt.img, -pt.size/2, -pt.size/2, pt.size, pt.img.height * s); ctx.restore(); }

/* ========= 名づけと紹介文（定義シート④の組み立て） ========= */
function makeFlowerInfo(an, stock){
  const sp = stock.sp, f = an.feat, r = rng(hashStr(an.fingerprint + sp.id));
  const color = stock.color;
  const adj = sp.adj[Math.floor(r() * sp.adj.length)];
  const colorWord = color.fixed || color.word;
  const name = `${adj} ${colorWord}・${sp.genus}`;
  /* 歌の印象の文 */
  let impKey = 'mid';
  if (f.rangeB === 'wide' || f.rangeB === 'vwide') impKey = 'wide';
  else if (f.rangeB === 'narrow') impKey = 'narrow';
  else if (f.longestPhraseSec >= 6.5) impKey = 'longphrase';
  else if (f.notesB === 'many') impKey = 'manynotes';
  else if (f.volB === 'big' || f.volB === 'huge') impKey = 'bigvol';
  else if (f.volB === 'small') impKey = 'smallvol';
  else if (f.meanBrightness >= 0.55) impKey = 'bright';
  else if (f.meanBrightness <= 0.3) impKey = 'deep';
  const songSen = SONG_IMPRESSIONS[impKey][Math.floor(r() * 2)][0];
  /* 花を表す言葉 */
  let word = sp.words[Math.floor(r() * sp.words.length)];
  if (sp.wordsByHue && color.fam && sp.wordsByHue[color.fam]) word = sp.wordsByHue[color.fam];
  /* 花の印象の文 */
  const nStems = stock.stems.length;
  const colorPhrase = color.fixed ? color.fixed : `${color.word}のような${FAMILY_JP[color.fam] || ''}`;
  let flowerSen;
  const pick2 = arr => arr[Math.floor(r() * arr.length)];
  if (sp.fixedWord === 'ゴールド') flowerSen = pick2(['金色の珍しい花を咲かせた。','金色の神々しい花を咲かせた。']);
  else if (nStems >= 4 && /(で|く|り|が|ある|満ち|秘めて)$/.test(word)) flowerSen = pick2(['幾輪もの花が寄り添うように咲いた。','賑やかに多くの花が咲いた。']);
  else if (stock.stems.some(s => s.dispH >= 520)) flowerSen = pick2(['ひときわ大きな花を咲かせた。','存在感のある花を咲かせた。']);
  else if (sp.scaleF && sp.scaleF < 0.8) flowerSen = pick2(['可憐な小さい花を咲かせた。','とても可愛らしい花を咲かせた。']);
  else if (!sp.dye) flowerSen = pick2([`${colorPhrase}の珍しい花を咲かせた。`, `${colorPhrase}の不思議な花を咲かせた。`]);
  else if (color.sat >= 0.5) flowerSen = pick2([`${colorPhrase}の鮮やかな花を咲かせた。`, `${colorPhrase}に輝く美しい花を咲かせた。`]);
  else flowerSen = pick2([`${colorPhrase}の淡く優しい花を咲かせた。`, `${colorPhrase}の淡く美しい花を咲かせた。`]);
  const closing = CLOSINGS[Math.floor(r() * CLOSINGS.length)];
  const intro = `${songSen}${word}${flowerSen} ${closing}`;
  return { name, intro, sp, color };
}
/* ========= オルゴール ========= */
function pluck(freq, when, vol){
  if (!AC) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = freq; o2.type = 'sine'; o2.frequency.value = freq * 3.01;
  const g2 = AC.createGain(); g2.gain.value = 0.18;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.16, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(AC.destination);
  o.start(t); o2.start(t); o.stop(t + 1.7); o2.stop(t + 1.7);
}
/* ========= 保存・シェア（いつも満開で描き直す） ========= */
function renderExport(){
  const EW = 1080, EH = 1350;
  const c = document.createElement('canvas'); c.width = EW; c.height = EH;
  const e = c.getContext('2d');
  e.fillStyle = '#fffdf8'; e.fillRect(0, 0, EW, EH);
  const gh = 1010;
  e.save(); e.beginPath(); e.rect(30, 30, EW - 60, gh); e.clip();
  e.translate(30, 30); e.scale((EW - 60) / W, gh / H);
  const bgImg = imgCache[A3 + BGS[selBg].file];
  const drawIt = () => {
    if (bgImg) e.drawImage(bgImg, 0, 0, W, H);
    const progOf = { global: 1, sprout: 1, stem: () => 1 };
    for (const stock of garden) drawStock(e, stock, progOf, 0, {});
    drawHaloFrame(e, garden, 0.85);
  };
  /* 画像は読み込み済み前提（画面表示で使用済み） */
  drawIt();
  e.restore();
  e.fillStyle = '#2d2a26'; e.textAlign = 'center';
  e.font = '700 44px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
  e.fillText(flowerInfo.name, EW / 2, gh + 108);
  e.font = '24px sans-serif'; e.fillStyle = '#a08b62';
  e.fillText('Bloom No. ' + hashStr(analysis.fingerprint).toString(36).toUpperCase().padStart(7, '0'), EW / 2, gh + 148);
  e.font = '26px "Hiragino Sans",sans-serif'; e.fillStyle = '#4c463c';
  const intro = flowerInfo.intro; let line = '', ly = gh + 196;
  for (const ch of intro){ if (e.measureText(line + ch).width > EW - 140){ e.fillText(line, EW / 2, ly); ly += 38; line = ''; } line += ch; }
  if (line) e.fillText(line, EW / 2, ly);
  e.font = '22px sans-serif'; e.fillStyle = '#a79c86';
  e.fillText('ハナウタ・ガーデン ' + APP_URL + '　©ボーカル道場K\'s VOX', EW / 2, EH - 26);
  return c;
}
function onSavedAction(){ if (phase === 'show') beginWilt(); }
$('btn-save').onclick = () => {
  onSavedAction();
  renderExport().toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'hanauta-garden.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
};
$('btn-share').onclick = async () => {
  onSavedAction();
  const text = `鼻歌で咲かせた私だけの花「${flowerInfo.name}」🌸
あなたの声でも咲かせてみて。
${APP_URL}
#ハナウタガーデン`;
  const c = renderExport();
  c.toBlob(async b => {
    const file = new File([b], 'hanauta-garden.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){ try { await navigator.share({ files: [file], text }); } catch (e) {} }
    else if (navigator.share){ try { await navigator.share({ text, url: APP_URL }); } catch (e) {} }
    else window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
  }, 'image/png');
};

  const cheer = pick(d.cheer.filter(Boolean));

  const kind = pick(['color', 'item', 'spot']);

    const fam = color.fixed ? (FMSG.fixedFam[sp.id] || 'ピンク') : (FAMILY_JP[color.fam] || 'ピンク');

  } else if (kind === 'item'){

const PETAL_TINTS = { galaxy:[222,45,82], rainbow:[330,55,86], crystal:[200,30,90], goldbell:[43,75,74], firefly:[84,55,78], lantern:[28,80,78], bubble:[255,45,86] };
function petalTones(sp, color){
  if (color && color.fam) return [color.hue, Math.round(clamp(color.sat, 0.15, 0.8) * 70), 85];
  const t = PETAL_TINTS[sp.id];
  if (t) return t;

function updatePetals(now, w){

    }

    ctx.bezierCurveTo(sz * 0.26, -sz * 0.14, sz * 0.24, sz * 0.14, 0, sz * 0.32);
    ctx.bezierCurveTo(-sz * 0.24, sz * 0.14, -sz * 0.26, -sz * 0.14, 0, -sz * 0.32);
    ctx.fillStyle = 'hsl(' + pt.h + ',' + Math.round(pt.s * 0.7) + '%,' + pt.l + '%)';
    ctx.fill();
    ctx.restore();
  }
}

/* ========= 名づけと紹介文（定義シート④の組み立て） ========= */
function makeFlowerInfo(an, stock){
  const sp = stock.sp, f = an.feat, r = rng(hashStr(an.fingerprint + sp.id));
  const color = stock.color;
  const adj = sp.adj[Math.floor(r() * sp.adj.length)];
  const colorWord = color.fixed || color.word;
  const name = `${adj} ${colorWord}・${sp.genus}`;
  /* 歌の印象の文: 当てはまる印象が複数あれば、その中から曲ごとに選ぶ（出だしの偏りを防ぐ） */
  const rImp = rng(hashStr(an.fingerprint + sp.id + 'imp'));
  const impKeys = [];
  if (f.rangeSemis >= 10) impKeys.push('wide'); else if (f.rangeSemis <= 5.5) impKeys.push('narrow');
  if (f.noteCount >= 30 || (f.changesPer4s || 0) >= 6) impKeys.push('manynotes');
  if (f.longestNoteSec >= 1.5) impKeys.push('longphrase');
  const impKey = impKeys.length ? impKeys[Math.floor(rImp() * impKeys.length)] : 'mid';
  const songSen = SONG_IMPRESSIONS[impKey][Math.floor(rImp() * 2)][0];
  /* 花を表す言葉 */
  let word = sp.words[Math.floor(r() * sp.words.length)];
  if (sp.wordsByHue && color.fam && sp.wordsByHue[color.fam]) word = sp.wordsByHue[color.fam];
  /* 花の印象の文 */
  const nStems = stock.stems.filter(s => (s.__to !== undefined ? s.__to : (s.finalProg === undefined ? 1 : s.finalProg)) >= 0.15).length;
  const pick2 = arr => arr[Math.floor(r() * arr.length)];
  const colorPhrase = color.fixed ? (FIXED_EXPR[color.fixed] || color.fixed) : pick2(COLOR_EXPR[color.fam] || COLOR_EXPR.pink);
  const vivid = sp.dye ? color.sat >= 0.5 : true;
  const tone = vivid ? '鮮やかな' : '淡く優しい';
  const big = stock.stems.some(s2 => s2.headH >= 255);
  const small = sp.scaleF && sp.scaleF < 0.8;
  let flowerSen;
  if (sp.fixedWord === 'ゴールド') flowerSen = pick2([`${colorPhrase}花を咲かせた。`, `${colorPhrase}花が咲いた。`]);
  else if (sp.cluster && nStems >= 3) flowerSen = pick2([`${colorPhrase}小さな花を、幾つも咲かせた。`, `${colorPhrase}花が、賑やかに幾つも咲いた。`]);
  else if (nStems >= 4) flowerSen = pick2([`${colorPhrase}${tone}花が、幾輪も寄り添うように咲いた。`, `${colorPhrase}${tone}花が、賑やかに多く咲いた。`]);
  else if (nStems <= 2 && !big) flowerSen = pick2([`${colorPhrase}花が、一輪に想いを込めたように咲いた。`, `${colorPhrase}渾身の一輪の花が咲いた。`]);
  else if (big) flowerSen = pick2([`${colorPhrase}${tone}、ひときわ大きな花を咲かせた。`, `${colorPhrase}存在感のある大きな花を咲かせた。`]);
  else if (small) flowerSen = pick2(['可憐な小さい花を咲かせた。','とても可愛らしい花を咲かせた。']);
  else if (!sp.dye) flowerSen = pick2([`${colorPhrase}珍しい花を咲かせた。`, `${colorPhrase}不思議な花を咲かせた。`]);
  else if (vivid) flowerSen = pick2([`${colorPhrase}鮮やかな花を咲かせた。`, `${colorPhrase}美しい花を咲かせた。`]);
  else flowerSen = pick2([`${colorPhrase}淡く優しい花を咲かせた。`, `${colorPhrase}淡く美しい花を咲かせた。`]);
  const closing = CLOSINGS[Math.floor(r() * CLOSINGS.length)];
  const intro = `${songSen}${word}、${flowerSen} ${closing}`;
  return { name, intro, sp, color };
}
/* ========= オルゴール ========= */
function pluck(freq, when, vol){
  if (!AC) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = freq; o2.type = 'sine'; o2.frequency.value = freq * 3.01;
  const g2 = AC.createGain(); g2.gain.value = 0.18;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.16, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(AC.destination);
  o.start(t); o2.start(t); o.stop(t + 1.7); o2.stop(t + 1.7);
}
/* ========= 保存・シェア（完成した姿そのまま描き直す） ========= */
async function renderExport(){
  const EW = 1080, EH = 1600;
  const c = document.createElement('canvas'); c.width = EW; c.height = EH;
  const e = c.getContext('2d');
  e.fillStyle = '#fffdf8'; e.fillRect(0, 0, EW, EH);
  const gh = 1275;
  e.save(); e.beginPath(); e.rect(30, 30, EW - 60, gh); e.clip();
  e.translate(30, 30); e.scale((EW - 60) / W, gh / H);
  const bgImg = await loadImg(A3 + BGS[selBg].file);
  const drawIt = () => {
    if (bgImg) e.drawImage(bgImg, 0, 0, W, H);
    const progOf = { global: 1, sprout: 1, stem: (st) => st.__to !== undefined ? st.__to : 1 };
    drawHaloFrame(e, garden, 0.85, 'halo');
    for (const stock of garden) drawStock(e, stock, progOf, 0, {});
    drawHaloFrame(e, garden, 0.85, 'frame');
  };
  /* 画像は読み込み済み前提（画面表示で使用済み） */
  drawIt();
  e.restore();
  /* 花名は絵の下部（土のあたり）にリボンの飾り枠で */
  const rbY = 30 + gh - 168, rbH = 98, rbX0 = 108, rbX1 = EW - 108, rbMid = rbY + rbH / 2;
  e.save();
  e.beginPath();
  e.moveTo(rbX0, rbY); e.lineTo(rbX1, rbY); e.lineTo(rbX1 - 34, rbMid); e.lineTo(rbX1, rbY + rbH); e.lineTo(rbX0, rbY + rbH); e.lineTo(rbX0 + 34, rbMid); e.closePath();
  e.fillStyle = 'rgba(22,17,12,0.66)'; e.fill();
  e.strokeStyle = 'rgba(216,178,106,0.95)'; e.lineWidth = 2.5; e.stroke();
  e.beginPath();
  e.moveTo(rbX0 + 9, rbY + 8); e.lineTo(rbX1 - 9, rbY + 8); e.lineTo(rbX1 - 38, rbMid); e.lineTo(rbX1 - 9, rbY + rbH - 8); e.lineTo(rbX0 + 9, rbY + rbH - 8); e.lineTo(rbX0 + 38, rbMid); e.closePath();
  e.strokeStyle = 'rgba(216,178,106,0.55)'; e.lineWidth = 1.2; e.stroke();
  e.fillStyle = '#fdf6e0'; e.textAlign = 'center'; e.textBaseline = 'middle';
  e.font = '700 41px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
  e.fillText(flowerInfo.name, EW / 2, rbMid + 2);
  e.restore();
  e.fillStyle = '#2d2a26'; e.textAlign = 'center';
  e.font = '24px sans-serif'; e.fillStyle = '#a08b62';
  e.fillText('Bloom No. ' + bloomNo, EW / 2, gh + 96);
  e.font = '26px "Hiragino Sans",sans-serif'; e.fillStyle = '#4c463c';
  const intro = flowerInfo.intro; let line = '', ly = gh + 146;
  for (const ch of intro){ if (e.measureText(line + ch).width > EW - 140){ e.fillText(line, EW / 2, ly); ly += 38; line = ''; } line += ch; }
  if (line) e.fillText(line, EW / 2, ly);
  e.font = '22px sans-serif'; e.fillStyle = '#a79c86';
  e.fillText('ハナウタ🌸ガーデン ' + APP_URL + '　©ボーカル道場K\'s VOX', EW / 2, EH - 26);
  return c;
}
$('btn-save').onclick = async () => {
  const note = (m) => { $('timer').textContent = m; };
  try {
    note('画像を作っています…');
    const c = await renderExport();
    let downloaded = false;
    try {
      const b = await new Promise(res => c.toBlob(res, 'image/png'));
      if (b){
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = 'hanauta-' + bloomNo + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        downloaded = true;
      }
    } catch (e) { /* ダウンロードができない環境では画像表示に切り替える */ }
    /* 確実に保存できるよう、完成画像そのものも表示する（長押しで保存） */
    $('zoomImg').src = c.toDataURL('image/png');
    $('zoomName').textContent = flowerInfo.name + '（完成画像）';
    zoomOpen = true;
    $('zoomModal').style.display = 'flex';
    note(downloaded ? '保存しました 🌸 画像も表示しています（長押しでも保存できます）' : '画像を表示しました。長押しで保存してください 🌸');
  } catch (err) {
    note('保存に失敗しました（' + (err && err.message ? err.message : '不明なエラー') + '）。もう一度お試しください。');
  }
};
$('btn-share').onclick = async () => {
  const note = (m) => { $('timer').textContent = m; };
  const text = `鼻歌で咲かせた私だけの花「${flowerInfo.name}」🌸
あなたの声でも咲かせてみて。
${APP_URL}
#ハナウタガーデン`;
  try {
    const c = await renderExport();
    const b = await new Promise(res => c.toBlob(res, 'image/png'));
    if (b && navigator.canShare){
      const file = new File([b], 'hanauta-' + bloomNo + '.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], text }); note('シェアしました 🌸'); return; }
    }
    if (navigator.share){ await navigator.share({ text, url: APP_URL }); note('シェアしました 🌸'); return; }
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
  } catch (err) {
    if (err && err.name === 'AbortError'){ note(''); return; }
    note('シェアに失敗しました（' + (err && err.message ? err.message : '不明なエラー') + '）。');
  }
};

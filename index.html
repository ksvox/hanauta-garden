        birth: p.start, hueJ: (r() * 10 - 5), satJ: (r() * 0.1 - 0.05), lightJ: (r() * 0.12 - 0.06), headPos: null,
      });
    }
    return stock;
  }
  /* 組み立て方式：花の数と育ち具合は成長シミュレーションで決まる */
  const flowers = simulateGrowth(group, feat || { stabCents: 20 });
  const MHbase = Math.min(clamp(615 * sf, 545, 745), Math.max(430, groundY - 205));
  const MH = MHbase * R * (sp.mhScale || 1);
  const nodeFs = [0.32, 0.48, 0.40, 0.58, 0.52], lenFs = [0.40, 0.34, 0.37, 0.30, 0.33];
  let side = r() < 0.5 ? 1 : -1;
  const branches = [];
  flowers.forEach((fl, i) => {
    stock.stems.push({
      rot: 0, flip: r() < 0.5, ind: (sp.inds3 ? ['full', 'fullb', 'fullc'] : ['full', 'fullb'])[i % (sp.inds3 ? 3 : 2)],
      headH: (MHbase / 5.3) * (0.72 + 0.28 * fl.size) * sf * flowerCurve(R) * (sp.headScale || 1),
      birth: fl.startT, hueJ: (r() * 10 - 5), satJ: (r() * 0.1 - 0.05), lightJ: (r() * 0.12 - 0.06),
      headPos: null, finalProg: fl.finalProg, flower: fl, kind: i === 0 ? 'main' : 'branch',
    });
    if (i > 0){
      const bi = i - 1;
      branches.push({ stemIdx: i, nodeF: nodeFs[bi % 5], len: MH * lenFs[bi % 5] * (sp.branchScale || 1), rot: side * (26 + r() * 9), side });
      side = -side;
    }
  });
  /* 花どうしの重なりを抑える: 候補手（角度・節・長さ）から最も離れる手を選ぶ局所探索 */
  const tipOf = (i) => {
    if (i === 0) return { x: 0, y: -MH };
    const br = branches[i - 1]; if (!br) return { x: 0, y: -MH };
    const th = br.rot * Math.PI / 180;
    return { x: Math.sin(th) * br.len, y: -MH * br.nodeF - Math.cos(th) * br.len };
  };
  const needDist = (i, j) => (stock.stems[i].headH + stock.stems[j].headH) * 0.52 * 0.72;
  const minRatio = (i) => {
    const ti = tipOf(i);
    let m = Infinity;
    for (let j = 0; j < stock.stems.length; j++){
      if (j === i) continue;
      m = Math.min(m, Math.hypot(ti.x - tipOf(j).x, ti.y - tipOf(j).y) / needDist(i, j));
    }
    return m;
  };
  const searchBranch = (i) => {
    const br = branches[i - 1]; if (!br) return;
    for (let tries = 0; tries < 30; tries++){
      const cur = minRatio(i);
      if (cur >= 1) break;
      const save = { rot: br.rot, nodeF: br.nodeF, len: br.len };
      const step = clamp((1 - cur) * 26, 5, 22);
      const cands = [
        { rot: save.rot + step }, { rot: save.rot - step },
        { nodeF: save.nodeF - 0.055 }, { nodeF: save.nodeF + 0.055 },
        { len: save.len * 0.9 }, { rot: save.rot + step, nodeF: save.nodeF - 0.055 },
        { rot: save.rot - step, nodeF: save.nodeF - 0.055 },
      ];
      let best = null, bestScore = cur;
      for (const c of cands){
        br.rot = clamp(c.rot !== undefined ? c.rot : save.rot, -58, 58);
        br.nodeF = clamp(c.nodeF !== undefined ? c.nodeF : save.nodeF, 0.22, 0.78);
        br.len = clamp(c.len !== undefined ? c.len : save.len, 90, 320);
        const sc = minRatio(i);
        if (sc > bestScore + 0.001){ bestScore = sc; best = { rot: br.rot, nodeF: br.nodeF, len: br.len }; }
      }
      if (!best){ Object.assign(br, save); break; }
      Object.assign(br, best);
    }
  };
  /* まず主花との距離を確保する（先端が近い枝は短くし、それでも近ければ節を下げる） */
  for (let i = 1; i < stock.stems.length; i++){
    const br = branches[i - 1]; if (!br) continue;
    let guard = 0;
    while (Math.hypot(tipOf(i).x, tipOf(i).y + MH) < needDist(i, 0) && guard++ < 24){
      if (br.len > 88) br.len *= 0.92;
      else if (br.nodeF > 0.24) br.nodeF -= 0.06;
      else break;
    }
  }
  for (let i = 1; i < stock.stems.length; i++) searchBranch(i);
  /* 往復に磨き上げて局所的な混雑をほぐす */
  for (let round = 0; round < 6; round++)
    for (let i = stock.stems.length - 1; i >= 1; i--) searchBranch(i);
  /* 近い花どうしで同じ満開画像が重ならないよう個体をずらす */
  for (let i = 1; i < stock.stems.length; i++){
    const ti = tipOf(i);
    for (let j = 0; j < i; j++){
      const tj = tipOf(j);
      const near = (stock.stems[i].headH + stock.stems[j].headH) * 0.52;
      if (Math.hypot(ti.x - tj.x, ti.y - tj.y) < near && stock.stems[i].ind === stock.stems[j].ind){
        const cyc = sp.inds3 ? ['full', 'fullb', 'fullc'] : ['full', 'fullb'];
        stock.stems[i].ind = cyc[(cyc.indexOf(stock.stems[i].ind) + 1) % cyc.length];
      }
    }
  }
  stock.plan = { MH, branches };
  return stock;
}

/* ========= 描画 ========= */
const cv = $('stage'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
function drawAnchored(x, img, name, rootX, rootY, dispH, rotDeg, flip, alpha){
  if (!img) return null;
  const anch = ANCH[name] || { root:[0.5, 0.99], head:[0.5, 0.25] };
  const s = dispH / img.height, w = img.width * s, h = img.height * s;
  const rx = (flip ? 1 - anch.root[0] : anch.root[0]) * w, ry = anch.root[1] * h;
  x.save(); x.translate(rootX, rootY); x.rotate(rotDeg * Math.PI / 180); if (flip) x.scale(-1, 1);
  x.globalAlpha *= alpha;
  x.drawImage(img, -rx, -ry, w, h);
  x.restore();
  const hx = (flip ? 1 - anch.head[0] : anch.head[0]) * w - rx, hy = anch.head[1] * h - ry;
  const th = rotDeg * Math.PI / 180;
  return { x: rootX + hx * Math.cos(th) - hy * Math.sin(th), y: rootY + hx * Math.sin(th) + hy * Math.cos(th) };
}
function stageFor(prog){
  if (prog < 0.45) return [{ k:'bud', a:1 }];
  if (prog < 0.75) { const t = (prog - 0.45) / 0.3; return [{ k:'bud', a:1 - t }, { k:'half', a:t }]; }
  const t = (prog - 0.75) / 0.25; return [{ k:'half', a:1 - t }, { k:'full', a:t }];
}
/* ========= 組み立て描画（茎パーツ＋枝＋頭） ========= */
function partDraw(x, img, meta, rootX, rootY, dispH, rotDeg, reveal){
  if (!img || reveal <= 0) return null;
  const w = img.width * (dispH / img.height), h = dispH;
  const th = rotDeg * Math.PI / 180;
  x.save(); x.translate(rootX, rootY); x.rotate(th);
  x.beginPath(); x.rect(-w, -h * reveal - 1, w * 2, h * reveal + 2); x.clip();
  x.drawImage(img, -meta.rx * w, -h, w, h);
  x.restore();
  const lx = (meta.tx - meta.rx) * w, ly = -h;
  return { x: rootX + lx * Math.cos(th) - ly * Math.sin(th), y: rootY + lx * Math.sin(th) + ly * Math.cos(th) };
}
function drawHeadAt(x, img, meta, tip, dispH, rotDeg, alpha){

  const w = dispH * (img.width / img.height), h = dispH;
  const ax = meta ? meta.a : 0.5, ay = meta && meta.b ? meta.b : 0.95;
  x.save(); x.translate(tip.x, tip.y); x.rotate(rotDeg * Math.PI / 180);
  x.globalAlpha *= alpha;
  x.drawImage(img, -ax * w, -ay * h + h * 0.02, w, h);
  x.restore();
  return { x: tip.x, y: tip.y - h * 0.42 };
}
function drawComposite(x, stock, progOf, now){
  const { sp, imgs } = stock;
  const gy = stock.groundY, RX = stock.rootX, plan = stock.plan;
  const sway = now ? Math.sin(now / 1400 + RX) * 0.7 : 0;
  const stemMeta = P5['stem-' + sp.stemFam] || { rx: 0.5, tx: 0.5 };
  const brMeta = P5['branch-' + sp.stemFam] || { rx: 0.5, tx: 0.5 };
  const pMain = progOf.stem(stock.stems[0], 0);
  const revealMain = easeOut(clamp(pMain / 0.55, 0, 1));
  /* 根元の葉（先頭2枚） */
  stock.sprigs.forEach((sg, i) => {
    if (i > 1) return;
    const p = clamp((progOf.global - sg.delay) / 0.6, 0, 1);
    if (p <= 0 || !imgs.sprig) return;
    drawAnchored(x, imgs.sprig, sp.sprig, RX, gy + 4, sg.len * (0.4 + 0.6 * easeOut(p)), sg.rot + sway * 0.5, sg.flip, Math.min(1, p * 1.6));
  });
  /* 芽（初期） */
  if (progOf.sprout > 0 && progOf.sprout < 1 && imgs.sprout && revealMain < 0.15){
    drawAnchored(x, imgs.sprout, sp.sprout, RX, gy + 4, 90 * easeOut(progOf.sprout) + 10, sway * 0.4, false, 1);
  }
  /* 枝（主茎より先に描き、付け根を主茎で隠す） */
  const tips = [{ st: stock.stems[0], idx: 0, rot: sway * 0.3, pos: null }];
  for (const br of plan.branches){
    const st = stock.stems[br.stemIdx]; if (!st) continue;
    const bp = progOf.stem(st, br.stemIdx);
    const reveal = easeOut(clamp(bp / 0.5, 0, 1));
    const tip = { st, idx: br.stemIdx, rot: br.rot, pos: null };
    tips.push(tip);
    if (revealMain < br.nodeF || reveal <= 0) continue;
    const node = { x: RX + sway * br.nodeF * 2, y: gy - plan.MH * br.nodeF * revealMain };
    tip.pos = partDraw(x, imgs.branchPart, brMeta, node.x, node.y, br.len, br.rot + sway * 0.5, reveal);
    tip.node = node;
  }
  /* 主茎 */
  const mainTip = partDraw(x, imgs.stemPart, stemMeta, RX, gy + 2, plan.MH, sway * 0.3, revealMain);
  tips[0].pos = mainTip;
  /* 茎に沿った葉（音の数が多いほど多い） */
  stock.sprigs.forEach((sg, i) => {
    if (i < 2 || !imgs.sprig) return;
    const cnt = stock.sprigs.length - 2;
    const f = 0.16 + 0.58 * ((i - 2) / Math.max(1, cnt - 1 || 1));
    if (revealMain < f) return;
    const p = clamp((progOf.global - sg.delay) / 0.6, 0, 1); if (p <= 0) return;
    const side = i % 2 === 0 ? 1 : -1;
    drawAnchored(x, imgs.sprig, sp.sprig, RX + side * 4, gy - plan.MH * f * revealMain, sg.len * 0.52 * (0.4 + 0.6 * easeOut(p)), side * (52 + (sg.rot % 10)) + sway * 0.5, side < 0, Math.min(1, p * 1.6));
  });

  if (imgs.sprig){
    for (const br of plan.branches){
      const st = stock.stems[br.stemIdx]; if (!st) continue;
      const bp = progOf.stem(st, br.stemIdx);
      if (revealMain < br.nodeF || bp <= 0) continue;
      drawAnchored(x, imgs.sprig, sp.sprig, RX + br.side * 6, gy - plan.MH * br.nodeF * revealMain, 95, br.side * 58 + sway * 0.5, br.side < 0, 0.95);
    }
  }
  /* 頭（枝→主役の順に描く） */
  const ordered = [...tips.slice(1), tips[0]];
  for (const tip of ordered){
    if (!tip.pos) continue;
    const st = tip.st;
    const prog = progOf.stem(st, tip.idx);
    const headProg = clamp((prog - 0.3) / 0.7, 0, 1);
    if (headProg <= 0) continue;
    const layers = stageFor(headProg);
    const sizePts = [[0, 0.30], [0.45, 0.48], [0.75, 0.75], [1, 1]];
    let scale = 1;
    for (let i = 1; i < sizePts.length; i++){ if (headProg <= sizePts[i][0]){ const x0 = sizePts[i-1][0], y0 = sizePts[i-1][1], x1 = sizePts[i][0], y1 = sizePts[i][1]; scale = y0 + (y1 - y0) * (headProg - x0) / (x1 - x0); break; } }
    for (const layer of layers){
      let img, nm;
      if (layer.k === 'full'){ img = imgs[st.ind] || imgs.full; nm = imgs.metaName[st.ind] || imgs.metaName.full; }
      else { img = imgs[layer.k]; nm = imgs.metaName[layer.k]; }
      if (!img) continue;
      const dyed = dyeImage(img, sp, stock.color.hue + st.hueJ, clamp((stock.color.sat + st.satJ) * colorSatMul, 0, 1), clamp(stock.color.light + st.lightJ, 0, 1));
      const ctr = drawHeadAt(x, dyed, P5[nm], tip.pos, st.headH * scale, tip.rot * 0.45 + sway, layer.a);
      if (layer.k === 'full' && layer.a > 0.5 && ctr) st.headPos = ctr;

}
function drawStock(x, stock, progOf, now, opts){
  const { sp, imgs } = stock; if (!imgs) return;
  const gy = stock.groundY;
  /* 土の盛り上がり（背景の土と同色・縁は溶ける） */
  drawSoilMound(x, stock.rootX, gy, 130, 22);
  if (!sp.cluster && sp.stemFam && imgs.stemPart && stock.plan){
    drawComposite(x, stock, progOf, now);
    return;
  }
  const sway = now ? Math.sin(now / 1400 + stock.rootX) * 0.7 : 0;
  /* 葉（根元から上向きに） */
  for (const sg of stock.sprigs){
    const p = clamp((progOf.global - sg.delay) / 0.6, 0, 1);
    if (p <= 0 || !imgs.sprig) continue;
    drawAnchored(x, imgs.sprig, sp.sprig, stock.rootX, gy + 4, sg.len * (0.4 + 0.6 * easeOut(p)), sg.rot + sway * 0.5, sg.flip, Math.min(1, p * 1.6));
  }
  /* 芽（初期） */
  if (progOf.sprout > 0 && progOf.sprout < 1 && imgs.sprout){
    drawAnchored(x, imgs.sprout, sp.sprout, stock.rootX, gy + 4, 90 * easeOut(progOf.sprout) + 10, sway * 0.4, false, 1);
  }
  /* 茎（段階素材のクロスフェード） */
  stock.stems.forEach((st, i) => {
    const prog = progOf.stem(st, i);
    if (prog <= 0) return;
    const sf = stageFor(prog);
    const scaleF = 0.34 + 0.66 * easeOut(clamp(prog / 0.9, 0, 1));
    const fullName0 = st.ind === 'fullb' ? imgs.fullbName : imgs.fullName;
    const fullHb = (ANCH[fullName0] && ANCH[fullName0].hb) ? ANCH[fullName0].hb[1] : 0.35;
    let imgH = st.headH * scaleF / Math.max(0.12, fullHb);
    if (sp.cluster) imgH = Math.max(imgH, st.headH * 2.6) * 1.45; /* 穂型は株全体で見せる（小さくなりすぎないよう引き上げ） */
    const fa = ANCH[fullName0];
    if (fa && fa.w > 0){ const maxW = W * 0.58; if (imgH * fa.w / fa.h > maxW) imgH = maxW * fa.h / fa.w; }
    for (const layer of sf){
      let img = imgs[layer.k], name = imgs[layer.k + 'Name'];
      if (layer.k === 'full'){
        img = st.ind === 'fullb' ? imgs.fullb : imgs.full;
        name = st.ind === 'fullb' ? imgs.fullbName : imgs.fullName;
      }
      if (!img) continue;
      const dyed = dyeImage(img, sp, stock.color.hue + st.hueJ, clamp((stock.color.sat + st.satJ) * colorSatMul, 0, 1), clamp(stock.color.light + st.lightJ, 0, 1));
      const head = drawAnchored(x, dyed, name, stock.rootX, gy + (sp.cluster ? imgH * 0.06 : 0), imgH, st.rot + sway, st.flip, layer.a);
      if (layer.k === 'full' && layer.a > 0.5) st.headPos = head;
    }
  });
  /* 穂型: 根元の集束部を前面の葉でも隠す（「土に枝を挿しただけ」に見せない） */
  if (sp.cluster && imgs.sprig){
    stock.sprigs.slice(0, 3).forEach((sg) => {
      const p = clamp((progOf.global - sg.delay) / 0.6, 0, 1);
      if (p <= 0) return;
      drawAnchored(x, imgs.sprig, sp.sprig, stock.rootX, gy + 7, sg.len * 0.55 * (0.4 + 0.6 * easeOut(p)), sg.rot + sway * 0.5, sg.flip, Math.min(1, p * 1.6) * 0.95);
    });
  }
}
function drawHaloFrame(x, stockList, t01, part){

        const progOf = { global: 1, sprout: 1, stem: (st) => st.__to !== undefined ? st.__to : (st.finalProg !== undefined ? st.finalProg : 1) };
        for (const stock of garden) drawStock(ctx, stock, progOf, now, {});
        ctx.restore();
        updatePetals(now, w);
        if (w >= 1){ finishWilt(); return; }
      } else {
        const progOf = { global: 1, sprout: 1, stem: (st) => st.__to !== undefined ? st.__to : (st.finalProg !== undefined ? st.finalProg : 1) };
        drawHaloFrame(ctx, garden, 1, 'halo');
        for (const stock of garden) drawStock(ctx, stock, progOf, now, {});
        drawHaloFrame(ctx, garden, 1, 'frame');
      }
    };
    loadImg(A3 + BGS[selBg].file).then(draw);
    rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}
function onBloom(){
  $('timer').textContent = '';
  $('f-name').textContent = flowerInfo.name;
  $('f-no').textContent = 'Bloom No. ' + bloomNo;
  $('f-intro').textContent = flowerInfo.intro;
  $('result').style.display = 'block'; $('result').classList.remove('gone');
  $('stagewrap').classList.add('nostick');
  setTimeout(() => $('result').scrollIntoView({ behavior: 'smooth', block: 'start' }), 400);
}
/* ========= 完成の表示 → 「もう一度育てる」「終了する」で枯れる → 土に戻る ========= */
let zoomOpen = false;
function closeZoom(){ zoomOpen = false; $('zoomModal').style.display = 'none'; }
$('btn-zoom').onclick = () => {
  if (!garden || !garden[0]) return;
  const st0 = garden[0];
  $('zoomImg').src = (st0.sp.cluster || !st0.sp.stemFam) ? A4 + st0.sp.base + '-full.webp' : A5 + st0.sp.base + '-full.webp';
  $('zoomName').textContent = flowerInfo ? flowerInfo.name : '';

$('btn-zoom-close').onclick = closeZoom;
$('zoomModal').addEventListener('click', e => { if (e.target === $('zoomModal')) closeZoom(); });
function finishWilt(){
  const mode = wilt ? wilt.mode : 'again';
  phase = 'done'; wilt = null; petals = [];
  cancelAnimationFrame(rafId); loopRunning = false;
  $('stagewrap').classList.remove('nostick');
  $('result').style.display = 'none'; $('result').classList.remove('gone');
  $('timer').textContent = '花は土に還りました 🌱';
  drawIdleStage();
  if (mode === 'again') setTimeout(() => $('btn-start').scrollIntoView({ behavior: 'smooth', block: 'center' }), 350);
  else setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 350);
}
function beginWilt(mode){
  closeZoom();
  phase = 'wilt'; wilt = { t0: performance.now(), level: 0, mode: mode || 'again' };
  $('result').classList.add('gone');
  $('timer').textContent = '花が枯れていきます…';
  $('stagewrap').scrollIntoView({ behavior: 'smooth', block: 'start' });

const PETAL_TINTS = { galaxy:[222,45,82], rainbow:[330,55,86], crystal:[200,30,90], goldbell:[43,75,74], firefly:[84,55,78], lantern:[28,80,78], bubble:[255,45,86] };
function petalTones(sp, color){
  if (color && color.fam) return [color.hue, Math.round(clamp(color.sat, 0.15, 0.8) * 70), 85];
  const t = PETAL_TINTS[sp.id];
  if (t) return t;
  return [330, 35, 87];
}
let petalAcc = 0, petalLastT = 0;
function updatePetals(now, w){
  /* 散り方: 少なめに、広く分散して、ゆっくりハラハラと。2〜3秒で、地面に届く前に下から消えていく */
  const pdt = petalLastT ? Math.min(now - petalLastT, 100) : 16; petalLastT = now;
  if (w > 0.05 && garden){
    petalAcc += pdt / 1000 * 4.2 * w;
    const heads = [];
    for (const st of garden) for (const sm of st.stems) if (sm.headPos) heads.push({ pos: sm.headPos, st });
    while (petalAcc >= 1 && petals.length < 24 && heads.length){
      petalAcc -= 1;
      const hp = heads[Math.floor(Math.random() * heads.length)];
      const tn = petalTones(hp.st.sp, hp.st.color);
      petals.push({ h: tn[0], s: tn[1], l: tn[2], born: now, life: 3800 + Math.random() * 1400, x: hp.pos.x + (Math.random() - 0.5) * 220, y: hp.pos.y + (Math.random() - 0.5) * 30, vx: (Math.random() - 0.5) * 1.5, vy: 0.22 + Math.random() * 0.2, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.05, size: 15 + Math.random() * 20, ph: Math.random() * 6.28 });
    }
    if (petals.length >= 24) petalAcc = Math.min(petalAcc, 1);
  }
  const gy = garden && garden[0] ? garden[0].groundY : H * BGS[selBg].ground;
  petals = petals.filter(pt => (now - pt.born) < pt.life && pt.y < gy + 4);
  for (const pt of petals){
    pt.ph += 0.045; pt.x += pt.vx + Math.sin(pt.ph) * 0.9; pt.y += pt.vy; pt.vy = Math.min(pt.vy + 0.0016, 0.62); pt.rot += pt.vr;
    const ageK = clamp(((now - pt.born) / pt.life - 0.60) / 0.40, 0, 1);
    const groundK = clamp((gy - 6 - pt.y) / 170, 0, 1);
    const alpha = 0.92 * (1 - ageK) * groundK;
    if (alpha <= 0.01) continue;
    const sz = pt.size;
    ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
    ctx.scale(0.55 + 0.45 * Math.abs(Math.sin(pt.ph)), 1);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(0, -sz / 2);
    ctx.bezierCurveTo(sz * 0.44, -sz * 0.26, sz * 0.4, sz * 0.24, 0, sz / 2);
    ctx.bezierCurveTo(-sz * 0.4, sz * 0.24, -sz * 0.44, -sz * 0.26, 0, -sz / 2);
    ctx.fillStyle = 'hsl(' + pt.h + ',' + pt.s + '%,' + Math.max(55, pt.l - 13) + '%)';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -sz * 0.32);
    ctx.bezierCurveTo(sz * 0.26, -sz * 0.14, sz * 0.24, sz * 0.14, 0, sz * 0.32);
    ctx.bezierCurveTo(-sz * 0.24, sz * 0.14, -sz * 0.26, -sz * 0.14, 0, -sz * 0.32);
    ctx.fillStyle = 'hsl(' + pt.h + ',' + Math.round(pt.s * 0.7) + '%,' + pt.l + '%)';
    ctx.fill();
    ctx.restore();
  }
}

/* ========= 名づけと紹介文（定義シート④の組み立て） ========= */
function makeFlowerInfo(an, stock){
  const sp = stock.sp, f = an.feat, r = rng(hashStr(an.fingerprint + sp.id));
  const color = stock.color;
  const adj = sp.adj[Math.floor(r() * sp.adj.length)];
  const colorWord = color.fixed || color.word;
  const name = `${adj} ${colorWord}・${sp.genus}`;
  /* 歌の印象の文: 当てはまる印象が複数あれば、その中から曲ごとに選ぶ（出だしの偏りを防ぐ） */
  const rImp = rng(hashStr(an.fingerprint + sp.id + 'imp'));
  const impKeys = [];
  if (f.rangeSemis >= 10) impKeys.push('wide'); else if (f.rangeSemis <= 5.5) impKeys.push('narrow');
  if (f.noteCount >= 30 || (f.changesPer4s || 0) >= 6) impKeys.push('manynotes');
  if (f.longestNoteSec >= 1.5) impKeys.push('longphrase');
  const impKey = impKeys.length ? impKeys[Math.floor(rImp() * impKeys.length)] : 'mid';
  const songSen = SONG_IMPRESSIONS[impKey][Math.floor(rImp() * 2)][0];
  /* 花を表す言葉 */
  let word = sp.words[Math.floor(r() * sp.words.length)];
  if (sp.wordsByHue && color.fam && sp.wordsByHue[color.fam]) word = sp.wordsByHue[color.fam];
  /* 花の印象の文 */
  const nStems = stock.stems.filter(s => (s.__to !== undefined ? s.__to : (s.finalProg === undefined ? 1 : s.finalProg)) >= 0.15).length;
  const colorPhrase = color.fixed ? color.fixed : `${color.word}のような${FAMILY_JP[color.fam] || ''}`;
  const pick2 = arr => arr[Math.floor(r() * arr.length)];
  const vivid = sp.dye ? color.sat >= 0.5 : true;
  const tone = vivid ? '鮮やかな' : '淡く優しい';
  const big = stock.stems.some(s2 => s2.headH >= 255);
  const small = sp.scaleF && sp.scaleF < 0.8;
  let flowerSen;
  if (sp.fixedWord === 'ゴールド') flowerSen = pick2(['金色の珍しい花を咲かせた。','金色の神々しい花を咲かせた。']);
  else if (sp.cluster && nStems >= 3) flowerSen = pick2([`${colorPhrase}の小さな花を、幾つも咲かせた。`, `${colorPhrase}の花が、賑やかに幾つも咲いた。`]);
  else if (nStems >= 4) flowerSen = pick2([`${colorPhrase}の${tone}花が、幾輪も寄り添うように咲いた。`, `${colorPhrase}の${tone}花が、賑やかに多く咲いた。`]);
  else if (nStems <= 2 && !big) flowerSen = pick2([`${colorPhrase}の花が、一輪に想いを込めたように咲いた。`, `${colorPhrase}の、渾身の一輪の花が咲いた。`]);
  else if (big) flowerSen = pick2([`${colorPhrase}の${tone}、ひときわ大きな花を咲かせた。`, `${colorPhrase}の、存在感のある大きな花を咲かせた。`]);
  else if (small) flowerSen = pick2(['可憐な小さい花を咲かせた。','とても可愛らしい花を咲かせた。']);
  else if (!sp.dye) flowerSen = pick2([`${colorPhrase}の珍しい花を咲かせた。`, `${colorPhrase}の不思議な花を咲かせた。`]);
  else if (vivid) flowerSen = pick2([`${colorPhrase}の鮮やかな花を咲かせた。`, `${colorPhrase}に輝く美しい花を咲かせた。`]);
  else flowerSen = pick2([`${colorPhrase}の淡く優しい花を咲かせた。`, `${colorPhrase}の淡く美しい花を咲かせた。`]);
  const closing = CLOSINGS[Math.floor(r() * CLOSINGS.length)];
  const intro = `${songSen}${word}、${flowerSen} ${closing}`;
  return { name, intro, sp, color };
}
/* ========= オルゴール ========= */
function pluck(freq, when, vol){
  if (!AC) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = freq; o2.type = 'sine'; o2.frequency.value = freq * 3.01;
  const g2 = AC.createGain(); g2.gain.value = 0.18;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.16, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(AC.destination);
  o.start(t); o2.start(t); o.stop(t + 1.7); o2.stop(t + 1.7);
}
/* ========= 保存・シェア（完成した姿そのまま描き直す） ========= */
async function renderExport(){
  const EW = 1080, EH = 1600;
  const c = document.createElement('canvas'); c.width = EW; c.height = EH;
  const e = c.getContext('2d');
  e.fillStyle = '#fffdf8'; e.fillRect(0, 0, EW, EH);
  const gh = 1275;
  e.save(); e.beginPath(); e.rect(30, 30, EW - 60, gh); e.clip();
  e.translate(30, 30); e.scale((EW - 60) / W, gh / H);
  const bgImg = await loadImg(A3 + BGS[selBg].file);
  const drawIt = () => {
    if (bgImg) e.drawImage(bgImg, 0, 0, W, H);
    const progOf = { global: 1, sprout: 1, stem: (st) => st.__to !== undefined ? st.__to : 1 };
    drawHaloFrame(e, garden, 0.85, 'halo');
    for (const stock of garden) drawStock(e, stock, progOf, 0, {});
    drawHaloFrame(e, garden, 0.85, 'frame');
  };
  /* 画像は読み込み済み前提（画面表示で使用済み） */
  drawIt();
  e.restore();
  /* 花名は絵の下部（土のあたり）にリボンの飾り枠で */
  const rbY = 30 + gh - 168, rbH = 98, rbX0 = 108, rbX1 = EW - 108, rbMid = rbY + rbH / 2;
  e.save();
  e.beginPath();
  e.moveTo(rbX0, rbY); e.lineTo(rbX1, rbY); e.lineTo(rbX1 - 34, rbMid); e.lineTo(rbX1, rbY + rbH); e.lineTo(rbX0, rbY + rbH); e.lineTo(rbX0 + 34, rbMid); e.closePath();
  e.fillStyle = 'rgba(22,17,12,0.66)'; e.fill();
  e.strokeStyle = 'rgba(216,178,106,0.95)'; e.lineWidth = 2.5; e.stroke();
  e.beginPath();
  e.moveTo(rbX0 + 9, rbY + 8); e.lineTo(rbX1 - 9, rbY + 8); e.lineTo(rbX1 - 38, rbMid); e.lineTo(rbX1 - 9, rbY + rbH - 8); e.lineTo(rbX0 + 9, rbY + rbH - 8); e.lineTo(rbX0 + 38, rbMid); e.closePath();
  e.strokeStyle = 'rgba(216,178,106,0.55)'; e.lineWidth = 1.2; e.stroke();
  e.fillStyle = '#fdf6e0'; e.textAlign = 'center'; e.textBaseline = 'middle';
  e.font = '700 41px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
  e.fillText(flowerInfo.name, EW / 2, rbMid + 2);
  e.restore();
  e.fillStyle = '#2d2a26'; e.textAlign = 'center';
  e.font = '24px sans-serif'; e.fillStyle = '#a08b62';
  e.fillText('Bloom No. ' + bloomNo, EW / 2, gh + 96);
  e.font = '26px "Hiragino Sans",sans-serif'; e.fillStyle = '#4c463c';
  const intro = flowerInfo.intro; let line = '', ly = gh + 146;
  for (const ch of intro){ if (e.measureText(line + ch).width > EW - 140){ e.fillText(line, EW / 2, ly); ly += 38; line = ''; } line += ch; }
  if (line) e.fillText(line, EW / 2, ly);
  e.font = '22px sans-serif'; e.fillStyle = '#a79c86';
  e.fillText('ハナウタ🌸ガーデン ' + APP_URL + '　©ボーカル道場K\'s VOX', EW / 2, EH - 26);
  return c;
}
$('btn-save').onclick = async () => {
  const note = (m) => { $('timer').textContent = m; };
  try {
    note('画像を作っています…');
    const c = await renderExport();
    let downloaded = false;
    try {
      const b = await new Promise(res => c.toBlob(res, 'image/png'));
      if (b){
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = 'hanauta-' + bloomNo + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        downloaded = true;
      }
    } catch (e) { /* ダウンロードができない環境では画像表示に切り替える */ }
    /* 確実に保存できるよう、完成画像そのものも表示する（長押しで保存） */
    $('zoomImg').src = c.toDataURL('image/png');
    $('zoomName').textContent = flowerInfo.name + '（完成画像）';
    zoomOpen = true;
    $('zoomModal').style.display = 'flex';
    note(downloaded ? '保存しました 🌸 画像も表示しています（長押しでも保存できます）' : '画像を表示しました。長押しで保存してください 🌸');
  } catch (err) {
    note('保存に失敗しました（' + (err && err.message ? err.message : '不明なエラー') + '）。もう一度お試しください。');
  }
};
$('btn-share').onclick = async () => {
  const note = (m) => { $('timer').textContent = m; };
  const text = `鼻歌で咲かせた私だけの花「${flowerInfo.name}」🌸
あなたの声でも咲かせてみて。
${APP_URL}
#ハナウタガーデン`;
  try {
    const c = await renderExport();
    const b = await new Promise(res => c.toBlob(res, 'image/png'));
    if (b && navigator.canShare){
      const file = new File([b], 'hanauta-' + bloomNo + '.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], text }); note('シェアしました 🌸'); return; }
    }
    if (navigator.share){ await navigator.share({ text, url: APP_URL }); note('シェアしました 🌸'); return; }
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
  } catch (err) {
    if (err && err.name === 'AbortError'){ note(''); return; }
    note('シェアに失敗しました（' + (err && err.message ? err.message : '不明なエラー') + '）。');
  }
};

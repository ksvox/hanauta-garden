const dyeCache = {};

  const x = c.getContext('2d'); x.drawImage(img, 0, 0);

    const id = x.getImageData(0, 0, c.width, c.height), d = id.data;

      const mx = Math.max(r,g,b), mn = Math.min(r,g,b), dl = mx - mn;

    const n = Math.max(2, Math.min(6, phrases.length + (phrases.length === 1 ? 2 : 0)));
    for (let i = 0; i < n; i++){
      const p = phrases[Math.min(i, phrases.length - 1)];

        rot: c * 21 + (r() * 6 - 3), flip: r() < 0.5, ind: i % 2 === 0 ? 'full' : 'fullb',
        headH: clamp(115 + p.durSec * 11, 125, 180) * sf * volScale * 0.8 * [1, 0.85, 0.94, 0.79, 0.9, 0.83][i % 6] * (0.95 + r() * 0.1),

      });
    }
    return stock;
  }
  /* 組み立て方式：花の数と育ち具合は成長シミュレーションで決まる */
  const flowers = simulateGrowth(group, feat || { stabCents: 20 });

      const cands = [

        { nodeF: save.nodeF - 0.055 }, { nodeF: save.nodeF + 0.055 },

    const br = branches[i - 1]; if (!br) continue;

    }

  for (let i = 1; i < stock.stems.length; i++) searchBranch(i);
  /* 往復に磨き上げて局所的な混雑をほぐす */
  for (let round = 0; round < 6; round++)
    for (let i = stock.stems.length - 1; i >= 1; i--) searchBranch(i);

  for (let i = 1; i < stock.stems.length; i++){
    const ti = tipOf(i);
    for (let j = 0; j < i; j++){
      const tj = tipOf(j);
      const near = (stock.stems[i].headH + stock.stems[j].headH) * 0.52;
      if (Math.hypot(ti.x - tj.x, ti.y - tj.y) < near && stock.stems[i].ind === stock.stems[j].ind){
        const cyc = sp.inds3 ? ['full', 'fullb', 'fullc'] : ['full', 'fullb'];
        stock.stems[i].ind = cyc[(cyc.indexOf(stock.stems[i].ind) + 1) % cyc.length];
      }
    }
  }

}

/* ========= 描画 ========= */
const cv = $('stage'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
function drawAnchored(x, img, name, rootX, rootY, dispH, rotDeg, flip, alpha){
  if (!img) return null;
  const anch = ANCH[name] || { root:[0.5, 0.99], head:[0.5, 0.25] };
  const s = dispH / img.height, w = img.width * s, h = img.height * s;
  const rx = (flip ? 1 - anch.root[0] : anch.root[0]) * w, ry = anch.root[1] * h;
  x.save(); x.translate(rootX, rootY); x.rotate(rotDeg * Math.PI / 180); if (flip) x.scale(-1, 1);
  x.globalAlpha *= alpha;
  x.drawImage(img, -rx, -ry, w, h);
  x.restore();
  const hx = (flip ? 1 - anch.head[0] : anch.head[0]) * w - rx, hy = anch.head[1] * h - ry;
  const th = rotDeg * Math.PI / 180;
  return { x: rootX + hx * Math.cos(th) - hy * Math.sin(th), y: rootY + hx * Math.sin(th) + hy * Math.cos(th) };
}
function stageFor(prog){
  if (prog < 0.45) return [{ k:'bud', a:1 }];
  if (prog < 0.75) { const t = (prog - 0.45) / 0.3; return [{ k:'bud', a:1 - t }, { k:'half', a:t }]; }
  const t = (prog - 0.75) / 0.25; return [{ k:'half', a:1 - t }, { k:'full', a:t }];
}
/* ========= 組み立て描画（茎パーツ＋枝＋頭） ========= */
function partDraw(x, img, meta, rootX, rootY, dispH, rotDeg, reveal){
  if (!img || reveal <= 0) return null;
  const w = img.width * (dispH / img.height), h = dispH;
  const th = rotDeg * Math.PI / 180;
  x.save(); x.translate(rootX, rootY); x.rotate(th);
  x.beginPath(); x.rect(-w, -h * reveal - 1, w * 2, h * reveal + 2); x.clip();
  x.drawImage(img, -meta.rx * w, -h, w, h);
  x.restore();
  const lx = (meta.tx - meta.rx) * w, ly = -h;
  return { x: rootX + lx * Math.cos(th) - ly * Math.sin(th), y: rootY + lx * Math.sin(th) + ly * Math.cos(th) };
}
function drawHeadAt(x, img, meta, tip, dispH, rotDeg, alpha){

  const w = dispH * (img.width / img.height), h = dispH;
  x.save(); x.translate(tip.x, tip.y + h * 0.05); x.rotate(rotDeg * Math.PI / 180);
  x.globalAlpha *= alpha;
  x.drawImage(img, -(meta ? meta.a : 0.5) * w, -h, w, h);
  x.restore();
  return { x: tip.x, y: tip.y - h * 0.42 };
}
function drawComposite(x, stock, progOf, now){
  const { sp, imgs } = stock;
  const gy = stock.groundY, RX = stock.rootX, plan = stock.plan;
  const sway = now ? Math.sin(now / 1400 + RX) * 0.7 : 0;
  const stemMeta = P5['stem-' + sp.stemFam] || { rx: 0.5, tx: 0.5 };
  const brMeta = P5['branch-' + sp.stemFam] || { rx: 0.5, tx: 0.5 };
  const pMain = progOf.stem(stock.stems[0], 0);
  const revealMain = easeOut(clamp(pMain / 0.55, 0, 1));
  /* 根元の葉（先頭2枚） */
  stock.sprigs.forEach((sg, i) => {
    if (i > 1) return;
    const p = clamp((progOf.global - sg.delay) / 0.6, 0, 1);
    if (p <= 0 || !imgs.sprig) return;
    drawAnchored(x, imgs.sprig, sp.sprig, RX, gy + 4, sg.len * (0.4 + 0.6 * easeOut(p)), sg.rot + sway * 0.5, sg.flip, Math.min(1, p * 1.6));

    tips.push(tip);
    if (revealMain < br.nodeF || reveal <= 0) continue;
    const node = { x: RX + sway * br.nodeF * 2, y: gy - plan.MH * br.nodeF * revealMain };
    tip.pos = partDraw(x, imgs.branchPart, brMeta, node.x, node.y, br.len, br.rot + sway * 0.5, reveal);
    tip.node = node;

      let img, nm;
      if (layer.k === 'full'){ img = imgs[st.ind] || imgs.full; nm = imgs.metaName[st.ind] || imgs.metaName.full; }
      else { img = imgs[layer.k]; nm = imgs.metaName[layer.k]; }
      if (!img) continue;
      const dyed = dyeImage(img, sp, stock.color.hue + st.hueJ, clamp(stock.color.sat + st.satJ, 0, 1), clamp(stock.color.light + st.lightJ, 0, 1));
      const ctr = drawHeadAt(x, dyed, P5[nm], tip.pos, st.headH * scale, tip.rot * 0.45 + sway, layer.a);
      if (layer.k === 'full' && layer.a > 0.5 && ctr) st.headPos = ctr;

}
function drawStock(x, stock, progOf, now, opts){
  const { sp, imgs } = stock; if (!imgs) return;
  const gy = stock.groundY;
  /* 土の盛り上がり */
  x.save(); x.fillStyle = soilColor();
  x.beginPath(); x.ellipse(stock.rootX, gy + 6, 120, 20, 0, 0, 6.29); x.fill(); x.restore();
  if (!sp.cluster && sp.stemFam && imgs.stemPart && stock.plan){
    drawComposite(x, stock, progOf, now);
    return;
  }
  const sway = now ? Math.sin(now / 1400 + stock.rootX) * 0.7 : 0;
  /* 葉（根元から上向きに） */
  for (const sg of stock.sprigs){
    const p = clamp((progOf.global - sg.delay) / 0.6, 0, 1);
    if (p <= 0 || !imgs.sprig) continue;
    drawAnchored(x, imgs.sprig, sp.sprig, stock.rootX, gy + 4, sg.len * (0.4 + 0.6 * easeOut(p)), sg.rot + sway * 0.5, sg.flip, Math.min(1, p * 1.6));
  }
  /* 芽（初期） */
  if (progOf.sprout > 0 && progOf.sprout < 1 && imgs.sprout){
    drawAnchored(x, imgs.sprout, sp.sprout, stock.rootX, gy + 4, 90 * easeOut(progOf.sprout) + 10, sway * 0.4, false, 1);
  }
  /* 茎（段階素材のクロスフェード） */
  stock.stems.forEach((st, i) => {
    const prog = progOf.stem(st, i);
    if (prog <= 0) return;
    const sf = stageFor(prog);
    const scaleF = 0.34 + 0.66 * easeOut(clamp(prog / 0.9, 0, 1));
    const fullName0 = st.ind === 'fullb' ? imgs.fullbName : imgs.fullName;
    const fullHb = (ANCH[fullName0] && ANCH[fullName0].hb) ? ANCH[fullName0].hb[1] : 0.35;
    let imgH = st.headH * scaleF / Math.max(0.12, fullHb);
    if (sp.cluster) imgH = Math.max(imgH, st.headH * 2.6); /* 穂型は株全体で見せる（横長素材が小さくなりすぎないように） */
    const fa = ANCH[fullName0];
    if (fa && fa.w > 0){ const maxW = W * 0.58; if (imgH * fa.w / fa.h > maxW) imgH = maxW * fa.h / fa.w; }
    for (const layer of sf){
      let img = imgs[layer.k], name = imgs[layer.k + 'Name'];
      if (layer.k === 'full'){
        img = st.ind === 'fullb' ? imgs.fullb : imgs.full;
        name = st.ind === 'fullb' ? imgs.fullbName : imgs.fullName;
      }
      if (!img) continue;
      const dyed = dyeImage(img, sp, stock.color.hue + st.hueJ, clamp(stock.color.sat + st.satJ, 0, 1), clamp(stock.color.light + st.lightJ, 0, 1));
      const head = drawAnchored(x, dyed, name, stock.rootX, gy, imgH, st.rot + sway, st.flip, layer.a);
      if (layer.k === 'full' && layer.a > 0.5) st.headPos = head;
    }
  });
}
function drawHaloFrame(x, stockList, t01, part){

  if (sp.fixedWord === 'ゴールド') flowerSen = pick2(['金色の珍しい花を咲かせた。','金色の神々しい花を咲かせた。']);
  else if (nStems >= 4 && /(で|く|り|が|ある|満ち|秘めて)$/.test(word)) flowerSen = pick2(['幾輪もの花が寄り添うように咲いた。','賑やかに多くの花が咲いた。']);
  else if (stock.stems.some(s => s.headH >= 255)) flowerSen = pick2(['ひときわ大きな花を咲かせた。','存在感のある花を咲かせた。']);
  else if (sp.scaleF && sp.scaleF < 0.8) flowerSen = pick2(['可憐な小さい花を咲かせた。','とても可愛らしい花を咲かせた。']);
  else if (!sp.dye) flowerSen = pick2([`${colorPhrase}の珍しい花を咲かせた。`, `${colorPhrase}の不思議な花を咲かせた。`]);
  else if (color.sat >= 0.5) flowerSen = pick2([`${colorPhrase}の鮮やかな花を咲かせた。`, `${colorPhrase}に輝く美しい花を咲かせた。`]);
  else flowerSen = pick2([`${colorPhrase}の淡く優しい花を咲かせた。`, `${colorPhrase}の淡く美しい花を咲かせた。`]);
  const closing = CLOSINGS[Math.floor(r() * CLOSINGS.length)];
  const intro = `${songSen}${word}${flowerSen} ${closing}`;
  return { name, intro, sp, color };
}
/* ========= オルゴール ========= */
function pluck(freq, when, vol){
  if (!AC) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = freq; o2.type = 'sine'; o2.frequency.value = freq * 3.01;
  const g2 = AC.createGain(); g2.gain.value = 0.18;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || 0.16, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(AC.destination);
  o.start(t); o2.start(t); o.stop(t + 1.7); o2.stop(t + 1.7);
}
/* ========= 保存・シェア（完成した姿そのまま描き直す） ========= */
async function renderExport(){
  const EW = 1080, EH = 1350;
  const c = document.createElement('canvas'); c.width = EW; c.height = EH;
  const e = c.getContext('2d');
  e.fillStyle = '#fffdf8'; e.fillRect(0, 0, EW, EH);
  const gh = 1010;
  e.save(); e.beginPath(); e.rect(30, 30, EW - 60, gh); e.clip();
  e.translate(30, 30); e.scale((EW - 60) / W, gh / H);
  const bgImg = await loadImg(A3 + BGS[selBg].file);
  const drawIt = () => {
    if (bgImg) e.drawImage(bgImg, 0, 0, W, H);
    const progOf = { global: 1, sprout: 1, stem: (st) => st.__to !== undefined ? st.__to : 1 };
    drawHaloFrame(e, garden, 0.85, 'halo');
    for (const stock of garden) drawStock(e, stock, progOf, 0, {});
    drawHaloFrame(e, garden, 0.85, 'frame');
  };
  /* 画像は読み込み済み前提（画面表示で使用済み） */
  drawIt();
  e.restore();
  e.fillStyle = '#2d2a26'; e.textAlign = 'center';
  e.font = '700 44px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';
  e.fillText(flowerInfo.name, EW / 2, gh + 108);
  e.font = '24px sans-serif'; e.fillStyle = '#a08b62';
  e.fillText('Bloom No. ' + bloomNo, EW / 2, gh + 148);
  e.font = '26px "Hiragino Sans",sans-serif'; e.fillStyle = '#4c463c';
  const intro = flowerInfo.intro; let line = '', ly = gh + 196;
  for (const ch of intro){ if (e.measureText(line + ch).width > EW - 140){ e.fillText(line, EW / 2, ly); ly += 38; line = ''; } line += ch; }
  if (line) e.fillText(line, EW / 2, ly);
  e.font = '22px sans-serif'; e.fillStyle = '#a79c86';
  e.fillText('ハナウタ・ガーデン ' + APP_URL + '　©ボーカル道場K\'s VOX', EW / 2, EH - 26);
  return c;
}
$('btn-save').onclick = async () => {
  const note = (m) => { $('timer').textContent = m; };
  try {
    note('画像を作っています…');
    const c = await renderExport();
    let downloaded = false;
    try {
      const b = await new Promise(res => c.toBlob(res, 'image/png'));
      if (b){
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = 'hanauta-garden.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        downloaded = true;
      }
    } catch (e) { /* ダウンロードができない環境では画像表示に切り替える */ }
    /* 確実に保存できるよう、完成画像そのものも表示する（長押しで保存） */
    $('zoomImg').src = c.toDataURL('image/png');
    $('zoomName').textContent = flowerInfo.name + '（完成画像）';
    zoomOpen = true;
    $('zoomModal').style.display = 'flex';
    note(downloaded ? '保存しました 🌸 画像も表示しています（長押しでも保存できます）' : '画像を表示しました。長押しで保存してください 🌸');
  } catch (err) {
    note('保存に失敗しました（' + (err && err.message ? err.message : '不明なエラー') + '）。もう一度お試しください。');
  }
};
$('btn-share').onclick = async () => {
  const note = (m) => { $('timer').textContent = m; };
  const text = `鼻歌で咲かせた私だけの花「${flowerInfo.name}」🌸
あなたの声でも咲かせてみて。
${APP_URL}
#ハナウタガーデン`;
  try {
    const c = await renderExport();
    const b = await new Promise(res => c.toBlob(res, 'image/png'));
    if (b && navigator.canShare){
      const file = new File([b], 'hanauta-garden.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], text }); note('シェアしました 🌸'); return; }
    }
    if (navigator.share){ await navigator.share({ text, url: APP_URL }); note('シェアしました 🌸'); return; }
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
  } catch (err) {
    if (err && err.name === 'AbortError'){ note(''); return; }
    note('シェアに失敗しました（' + (err && err.message ? err.message : '不明なエラー') + '）。');
  }
};
